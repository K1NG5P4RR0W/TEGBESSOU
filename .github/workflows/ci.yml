name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Installer uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: gateway — lint, typage, tests
        working-directory: gateway
        run: |
          uv sync
          uv run ruff check .
          uv run mypy .
          uv run pytest
      - name: api_pentest — lint, typage, tests
        working-directory: api_pentest
        run: |
          uv sync
          uv run ruff check .
          uv run mypy .
          uv run pytest
