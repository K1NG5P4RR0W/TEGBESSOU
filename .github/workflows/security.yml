name: security
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (détection de secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks (binaire officiel, épinglé + checksum vérifié)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          FILE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${FILE}" -o "${FILE}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep "${FILE}" checksums.txt | sha256sum -c -
          tar -xzf "${FILE}" gitleaks
          ./gitleaks version
      - name: Scanner le dépôt
        run: ./gitleaks git . --redact --verbose
