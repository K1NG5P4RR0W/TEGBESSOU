name: tegbessou

# Stack de DÉVELOPPEMENT. Ports liés à 127.0.0.1 uniquement (pas d'exposition
# réseau). Le build local est OK sur le poste opérateur ; ne PAS builder sur un
# hôte contraint en RAM (cf. docs/IMPLEMENTATION.md §4/§16).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tegbessou}
      POSTGRES_USER: ${POSTGRES_USER:-tegbessou_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tegbessou_app} -d ${POSTGRES_DB:-tegbessou}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tegbessou}
      POSTGRES_USER: ${POSTGRES_USER:-tegbessou_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    mem_limit: 512m

  api_pentest:
    build: ./api_pentest
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m

volumes:
  pgdata:
