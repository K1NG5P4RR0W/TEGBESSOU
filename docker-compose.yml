name: tegbessou

# Stack de DÉVELOPPEMENT. Ports liés à 127.0.0.1 uniquement.
# Le build local est OK sur le poste opérateur ; pas de build sur un hôte
# contraint en RAM (cf. docs/IMPLEMENTATION.md §4/§16).

# Réseaux Docker (E1 + E3a, docs/EXECUTION_DESIGN.md, docs/E3_EGRESS_DESIGN.md) :
# - db_net     : postgres + gateway. Le worker n'y est JAMAIS raccordé.
# - queue_net  : redis + gateway + api_pentest. Le worker n'y est PLUS
#                raccordé depuis E3a (voir worker_net ci-dessous).
# - worker_net : worker + redis (rattaché en plus) + egress-gateway.
#                `internal: true` => aucune route NAT vers Internet créée par
#                Docker pour ce réseau : même la route par défaut que Docker
#                assigne automatiquement (le bridge lui-même) ne mène nulle
#                part hors de ce sous-réseau. Le service worker-netinit
#                (partage le netns du worker, NET_ADMIN le temps d'une
#                commande puis s'arrête) réécrit la route par défaut du
#                worker pour qu'elle pointe explicitement vers l'IP statique
#                d'egress-gateway — sans jamais donner NET_ADMIN au worker
#                lui-même. Le worker garde son accès Redis (même sous-réseau
#                => connexion directe, pas de passage par la passerelle).
# - egress_net : uplink Internet réel (NAT Docker normal), UNIQUEMENT pour
#                egress-gateway — jamais pour le worker.
networks:
  db_net:
  queue_net:
  worker_net:
    internal: true
    ipam:
      config:
        - subnet: 10.90.0.0/24
  egress_net:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tegbessou}
      POSTGRES_USER: ${POSTGRES_USER:-tegbessou_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 512m
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tegbessou_app} -d ${POSTGRES_DB:-tegbessou}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    networks:
      queue_net: {}
      worker_net:
        ipv4_address: 10.90.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      target: gateway
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tegbessou}
      POSTGRES_USER: ${POSTGRES_USER:-tegbessou_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      REDIS_URL: redis://redis:6379/0
      TEGBESSOU_MASTER_KEY: ${TEGBESSOU_MASTER_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      REQUIRE_MFA: ${REQUIRE_MFA:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    mem_limit: 512m
    volumes:
      - authorizations:/data/authorizations
    networks:
      - db_net
      - queue_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Worker arq isolé (E1, egress sandboxé depuis E3a, subfinder depuis E3b).
  # Même base d'image que la gateway (Dockerfile multi-stage, stage `worker`) ;
  # commande + réseau + sandbox différents. C'EST le seul stage qui contient
  # des outils offensifs (subfinder ici, épinglé — httpx/nmap suivront le
  # même patron) : la gateway (stage `gateway`) n'en contient aucun, pour ne
  # pas grossir la surface d'attaque du composant exposé.
  # PAS de variable POSTGRES_* : le worker ne connaît que Redis.
  # Réseau : worker_net UNIQUEMENT (internal: true). Sa route par défaut est
  # réécrite par worker-netinit vers egress-gateway ; il n'a AUCUNE route
  # Internet directe. Redis reste joignable en direct (même sous-réseau).
  worker:
    build:
      context: ./gateway
      target: worker
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      REDIS_URL: redis://redis:6379/0
      # REQUIS (vérifié à l'exécution), pas seulement défensif : subfinder
      # résout un répertoire $HOME avant même d'honorer `-config`, et échoue
      # si $HOME n'est pas défini du tout (UID non-root sans passwd exploité
      # par la lib de conf sous-jacente). La valeur pointe sur le tmpfs (seul
      # chemin inscriptible, cf. read_only ci-dessous) mais reste VIDE :
      # aucun fichier n'y est lu, le seul fichier réellement chargé est celui
      # baké en lecture seule et pointé explicitement par `-config`
      # (app/wrappers/subfinder.py, voir Dockerfile stage `worker`).
      HOME: /tmp
    # Le résolveur DNS interne de Docker (127.0.0.11) refuse de transiter les
    # requêtes externes sur un réseau internal:true (anti-exfiltration côté
    # Docker) : le worker utilise donc directement le résolveur contrôlé de
    # la passerelle pour tout nom (interne comme externe) — cohérent avec
    # "DNS autorisé uniquement vers un résolveur contrôlé".
    dns:
      - 10.90.0.2
    depends_on:
      redis:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
    networks:
      - worker_net
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Réécrit UNE FOIS la route par défaut du worker vers egress-gateway, puis
  # s'arrête. Partage le netns du worker (network_mode) : NET_ADMIN reste sur
  # ce conteneur jetable, jamais sur le worker lui-même (qui garde
  # cap_drop: ALL en permanence). Aucun accès DB/secret, pas de volume,
  # aucun code applicatif — seulement iproute2.
  worker-netinit:
    image: alpine:3.20
    command:
      - sh
      - -c
      - "ip route replace default via 10.90.0.2"
    network_mode: "service:worker"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      worker:
        condition: service_started
      egress-gateway:
        condition: service_healthy
    restart: "no"

  # Passerelle d'egress (E3a) — sidecar sandboxé. Seule sortie réseau du
  # worker. Deny-par-défaut : nftables (L3/L4 + redirection locale du DNS et
  # du HTTP(S)) + nginx (filtrage par nom d'hôte — Host en HTTP, SNI en
  # HTTPS — SANS déchiffrement TLS, aucune CA injectée) + dnsmasq (résolveur
  # DNS contrôlé). Toute connexion refusée est journalisée avec sa
  # destination (voir egress-gateway/README.md).
  # Aucun accès DB/secret : pas de variable POSTGRES_*/TEGBESSOU_MASTER_KEY.
  egress-gateway:
    build: ./egress-gateway
    environment:
      WORKER_NET_SUBNET: 10.90.0.0/24
      # Allowlist B (E3b, sources OSINT passives de subfinder, sans clé API) +
      # allowlist A (E3 final, cible in-scope de TEST pour httpx) chargées
      # ENSEMBLE — liste de fichiers séparés par ':', voir entrypoint.sh.
      # allowlist-test.conf reste dans le dépôt pour les vérifications
      # manuelles de la barrière (E3a, example.com) — voir egress-gateway/README.md.
      EGRESS_POLICY_FILE: /etc/egress/policy/allowlist-osint.conf:/etc/egress/policy/allowlist-target-test.conf
    volumes:
      - ./egress-gateway/policy:/etc/egress/policy:ro
    networks:
      worker_net:
        ipv4_address: 10.90.0.2
      egress_net: {}
    mem_limit: 128m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 1
    healthcheck:
      test: ["CMD", "nft", "list", "table", "inet", "egress"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api_pentest:
    build: ./api_pentest
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    networks:
      - queue_net

volumes:
  pgdata:
  authorizations:
