# Résolveur DNS contrôlé — seul résolveur que le worker peut atteindre
# (nftables redirige tout :53 émis par worker_net vers ce process).
#
# E3a : résout tout domaine (pas de filtrage par nom résolu). Le contrôle
# réel se fait en aval, sur la CONNEXION (Host/SNI côté nginx, IP/port côté
# nftables) — pas sur la résolution. Filtrer aussi les noms résolus ici est
# une itération future (voir README §Limites connues).
no-resolv
server=1.1.1.1
server=9.9.9.9
# Le résolveur DNS interne de Docker (127.0.0.11) refuse de transiter les
# requêtes externes sur un réseau internal:true (comportement Docker voulu,
# anti-exfiltration) : le worker utilise donc CE résolveur pour tout,
# y compris les noms internes. "redis" n'existe pas côté DNS public : on le
# déclare ici en statique (même IP que dans docker-compose.yml).
host-record=redis,10.90.0.3
listen-address=0.0.0.0
port=5353
bind-interfaces
no-hosts
no-daemon
log-queries
log-facility=/var/log/egress/dnsmasq.log
