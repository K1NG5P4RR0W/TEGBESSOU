#!/usr/sbin/nft -f
# Politique réseau de la passerelle d'egress — deny-par-défaut.
#
# Modèle : le worker (réseau worker_net, ${WORKER_NET_SUBNET}) a cette
# passerelle comme unique route par défaut. Tout trafic :53/:80/:443 émis par
# le worker est intercepté (redirect) vers les services locaux qui appliquent
# la politique (dnsmasq = résolveur contrôlé ; nginx = filtrage Host/SNI sans
# déchiffrement). Tout le reste (autre port, autre protocole) traverse la
# chaîne forward et y est refusé + journalisé : c'est le filet L3/L4.

table inet egress {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;

        ip saddr $WORKER_NET_SUBNET udp dport 53 redirect to :5353
        ip saddr $WORKER_NET_SUBNET tcp dport 53 redirect to :5353
        ip saddr $WORKER_NET_SUBNET tcp dport 80 redirect to :8080
        ip saddr $WORKER_NET_SUBNET tcp dport 443 redirect to :8443
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        # Services locaux vers lesquels prerouting redirige le trafic worker.
        ip saddr $WORKER_NET_SUBNET udp dport 5353 accept
        ip saddr $WORKER_NET_SUBNET tcp dport 5353 accept
        ip saddr $WORKER_NET_SUBNET tcp dport 8080 accept
        ip saddr $WORKER_NET_SUBNET tcp dport 8443 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept

        # Tout ce qui n'a pas été intercepté par prerouting (donc pas
        # :53/:80/:443) arrive ici avec une destination externe réelle :
        # c'est exactement le trafic "hors allowlist / hors HTTP(S)" que le
        # worker ne doit JAMAIS pouvoir atteindre. Refusé + loggé (ulogd lit
        # ce group NFLOG et écrit src/dst/port dans /var/log/egress/deny.log).
        log prefix "egress-deny: " group 1 counter reject
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
