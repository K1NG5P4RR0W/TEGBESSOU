# user root : ce conteneur n'a de toute façon que NET_ADMIN/NET_RAW comme
# capabilities Linux (cap_drop: ALL + cap_add ciblé, cf. docker-compose.yml) ;
# la frontière de sécurité est la capability, pas l'UID. Séparer nginx sous
# un UID applicatif nécessiterait CAP_CHOWN/CAP_SETUID que nous refusons
# volontairement d'ajouter.
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/egress/nginx-error.log notice;

events {
    worker_connections 512;
}

http {
    access_log /var/log/egress/http-deny.log;

    resolver 127.0.0.1:5353 valid=10s;

    # Généré à partir de policy/allowlist-test.conf par entrypoint.sh.
    # Ligne type : "example.com 1;" — jamais éditable par le worker.
    map $http_host $http_egress_allowed {
        default 0;
        include /etc/nginx/generated/allowed_hosts.map;
    }

    server {
        listen 0.0.0.0:8080;
        server_name _;

        # Filtrage sur l'en-tête Host, en clair (HTTP), sans inspecter le corps.
        if ($http_egress_allowed = 0) {
            return 403;
        }

        location / {
            proxy_pass http://$http_host$request_uri;
            proxy_set_header Host $http_host;
        }
    }
}

stream {
    resolver 127.0.0.1:5353 valid=10s;

    # Généré à partir de policy/allowlist-test.conf.
    # Ligne type : "example.com example.com:443;"
    map $ssl_preread_server_name $tls_egress_upstream {
        default 127.0.0.1:1;  # rien n'écoute ici -> refus immédiat côté client
        include /etc/nginx/generated/allowed_tls_upstreams.map;
    }

    log_format egress '$remote_addr [$time_local] sni=$ssl_preread_server_name upstream=$tls_egress_upstream status=$status';
    access_log /var/log/egress/tls-egress.log egress;

    server {
        listen 0.0.0.0:8443;
        # Lit le SNI du ClientHello TLS SANS terminer la session : aucune clé
        # privée, aucune CA côté worker. On relaie les octets bruts tels
        # quels vers la vraie origine si (et seulement si) le SNI est autorisé.
        ssl_preread on;
        proxy_pass $tls_egress_upstream;
        proxy_connect_timeout 3s;
    }
}
