# Allowlist B — sources OSINT approuvées (E3b), un hôte par ligne.
# Statique, versionnée, revue : PAS remplie dynamiquement (docs/E3_EGRESS_DESIGN.md §3).
# Utilisée pour le filtrage HTTP (Host) ET HTTPS (SNI), sans déchiffrement TLS.
#
# Correspondance source subfinder -> host contacté (vérifiée contre le code
# source réel de subfinder v2.16.0, pas supposée — voir
# pkg/subscraping/sources/<source>/<source>.go dans le dépôt subfinder) :
#
#   hackertarget   -> api.hackertarget.com     (clé optionnelle, fonctionne sans)
#   rapiddns       -> rapiddns.io              (sans clé)
#   anubis         -> anubisdb.com             (sans clé ; l'ancien endpoint
#                                                jldc.me/jonlu.ca a changé)
#   sitedossier    -> www.sitedossier.com      (sans clé)
#   waybackarchive -> web.archive.org          (sans clé)
#   digitorus      -> certificatedetails.com   (sans clé)
#   commoncrawl    -> index.commoncrawl.org    (sans clé)
#   submd          -> api.sub.md               (clé optionnelle, fonctionne sans)
#
# Sources volontairement exclues (voir gateway/app/wrappers/subfinder.py) :
#   - alienvault, certspotter : nécessitent désormais une clé API (v2.16.0),
#     exclues par la décision "pas de clé API pour l'instant".
#   - crtsh : sa voie primaire est une connexion PostgreSQL brute vers
#     crt.sh:5432 (pas HTTP/HTTPS) — le sas ne filtre que 53/80/443, cette
#     connexion serait donc bloquée en fonctionnement normal (contredit
#     l'exigence "aucune requête ne doit être bloquée"), même si crtsh a un
#     repli HTTPS. Exclue pour rester honnête sur l'allowlist.
#
# Ce fichier est monté en lecture seule dans egress-gateway ; le worker n'y a
# ni accès réseau ni accès disque — il ne peut jamais l'éditer.
api.hackertarget.com
rapiddns.io
anubisdb.com
www.sitedossier.com
web.archive.org
certificatedetails.com
index.commoncrawl.org
api.sub.md
