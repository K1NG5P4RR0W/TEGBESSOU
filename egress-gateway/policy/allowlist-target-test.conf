# Allowlist A — cibles in-scope (E3 final), un hôte par ligne.
# Sert au trafic ACTIF (httpx ici ; nmap etc. plus tard) : celui qui touche
# directement la cible de l'engagement, par opposition au trafic PASSIF
# (subfinder, allowlist B dans allowlist-osint.conf).
#
# MÉCANISME DE CETTE PR (scaffolding de preuve, pas la solution finale) :
# ce fichier est STATIQUE, comme allowlist-osint.conf — il liste la cible du
# scénario de démonstration (voir egress-gateway/README.md, section httpx),
# et non une résolution automatique du scope de chaque engagement. La
# passerelle d'egress n'a qu'une politique par instance de stack (voir
# entrypoint.sh) : elle est chargée une fois avec l'allowlist B (OSINT) ET
# cette allowlist A ensemble, jamais ouverte au-delà de ces hôtes.
#
# La génération DYNAMIQUE par engagement (scope résolu en domaines/IP au
# lancement d'un run, poussé à la passerelle) est explicitement hors
# périmètre de cette PR — voir docs/E3_EGRESS_DESIGN.md §6/§10 : c'est du B5.
#
# Ce fichier est monté en lecture seule dans egress-gateway ; le worker n'y a
# ni accès réseau ni accès disque — il ne peut jamais l'éditer.
example.com
